<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Pi Livecraft — build in flow</title>
  <desc id="desc">A vibrant Pi Livecraft workspace illustration with an active coding session, live tools, and a bright Pi mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2f"/>
      <stop offset="0.52" stop-color="#151333"/>
      <stop offset="1" stop-color="#281338"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58f2bd"/>
      <stop offset="1" stop-color="#41a7ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcd72"/>
      <stop offset="1" stop-color="#ff6b8a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a6b7ff" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="220" fill="#7d5cff" opacity=".14" filter="url(#soft)"/>
  <circle cx="80" cy="750" r="230" fill="#42e7b0" opacity=".1" filter="url(#soft)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <g opacity=".75">
    <path d="M-30 610C180 470 280 680 438 545S730 315 935 450s170 6 310-70" fill="none" stroke="#4cf1bf" stroke-opacity=".18" stroke-width="2"/>
    <path d="M-20 638C190 498 285 708 452 571S742 342 950 475s171 8 290-68" fill="none" stroke="#9d7bff" stroke-opacity=".18" stroke-width="2"/>
  </g>

  <g transform="translate(92 72)">
    <rect width="1016" height="656" rx="28" fill="#0b1124" fill-opacity=".92" stroke="#9ba7e8" stroke-opacity=".2" stroke-width="2"/>
    <rect x="1" y="1" width="1014" height="62" rx="27" fill="#202743"/>
    <path d="M1 63h1014" stroke="#9ba7e8" stroke-opacity=".18"/>
    <circle cx="30" cy="31" r="6" fill="#ff718e"/>
    <circle cx="52" cy="31" r="6" fill="#ffcb71"/>
    <circle cx="74" cy="31" r="6" fill="#5ce9b5"/>
    <text x="108" y="37" fill="#dce2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">PI LIVECRAFT</text>
    <text x="820" y="37" fill="#8d9ac8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">LOCAL • LIVE</text>
    <circle cx="972" cy="31" r="5" fill="#59edb4" filter="url(#glow)"/>

    <rect x="26" y="88" width="232" height="540" rx="18" fill="#151d35" stroke="#7181bd" stroke-opacity=".16"/>
    <text x="50" y="128" fill="#8c9bd1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">WORKSPACE</text>
    <text x="50" y="172" fill="#f1f4ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">pi-lab</text>
    <text x="50" y="196" fill="#7180b5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">/home/you/projects</text>
    <rect x="46" y="224" width="192" height="42" rx="10" fill="#263557" stroke="#53eab6" stroke-opacity=".65"/>
    <circle cx="66" cy="245" r="5" fill="#59edb4"/>
    <text x="82" y="250" fill="#effff9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">active session</text>
    <g fill="#818fbe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <text x="54" y="314">▸  src/</text>
      <text x="54" y="348">▸  agents/</text>
      <text x="54" y="382">▸  README.md</text>
      <text x="54" y="416">▸  package.json</text>
    </g>
    <path d="M50 482h184M50 506h140M50 530h164" stroke="#52618f" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <rect x="50" y="570" width="72" height="24" rx="12" fill="#342b68"/>
    <text x="86" y="586" text-anchor="middle" fill="#d6c9ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">READY</text>

    <rect x="282" y="88" width="464" height="540" rx="18" fill="#10182d" stroke="#7181bd" stroke-opacity=".16"/>
    <text x="310" y="128" fill="#8c9bd1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">CONVERSATION / 014</text>
    <text x="310" y="174" fill="#f7f8ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="800">Make it feel alive.</text>
    <text x="310" y="203" fill="#9aa8d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">One prompt. Real files. Zero friction.</text>
    <rect x="310" y="238" width="350" height="1" fill="#52618f" opacity=".5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <text x="310" y="282" fill="#58f2bd">❯</text>
      <text x="334" y="282" fill="#e7ebff">Design a playful landing visual</text>
      <text x="334" y="307" fill="#7d8ab8">for Pi Livecraft in one SVG.</text>
    </g>
    <rect x="310" y="342" width="350" height="176" rx="14" fill="#1a2643" stroke="#4e6094" stroke-opacity=".55"/>
    <text x="332" y="374" fill="#d9e1ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">✦  Pi is crafting</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="332" y="408" fill="#a7b5df">✓  read the brief</text>
      <text x="332" y="436" fill="#a7b5df">✓  shape the experience</text>
      <text x="332" y="464" fill="#5ce9b5">◉  render the good stuff</text>
    </g>
    <rect x="332" y="486" width="248" height="4" rx="2" fill="#31446f"/>
    <rect x="332" y="486" width="189" height="4" rx="2" fill="url(#accent)"/>
    <text x="310" y="578" fill="#59698f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">⌁ streaming response • 2.4s</text>

    <rect x="770" y="88" width="220" height="540" rx="18" fill="#151d35" stroke="#7181bd" stroke-opacity=".16"/>
    <text x="796" y="128" fill="#8c9bd1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">LIVE TOOLS</text>
    <circle cx="800" cy="177" r="10" fill="#24365d" stroke="#58f2bd" stroke-width="2"/>
    <path d="M795 177l4 4 7-9" fill="none" stroke="#58f2bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="822" y="182" fill="#e7ebff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">File system</text>
    <text x="822" y="201" fill="#7d8ab8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">synced</text>
    <circle cx="800" cy="246" r="10" fill="#33295f" stroke="#d680ff" stroke-width="2"/>
    <path d="M795 246h10M800 241v10" stroke="#d680ff" stroke-width="2" stroke-linecap="round"/>
    <text x="822" y="251" fill="#e7ebff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Agent loop</text>
    <text x="822" y="270" fill="#7d8ab8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">thinking clearly</text>
    <circle cx="800" cy="315" r="10" fill="#4b3152" stroke="#ff9c75" stroke-width="2"/>
    <path d="M796 315h8M800 311v8" stroke="#ff9c75" stroke-width="2" stroke-linecap="round"/>
    <text x="822" y="320" fill="#e7ebff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Terminal</text>
    <text x="822" y="339" fill="#7d8ab8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">command complete</text>
    <path d="M796 390h166M796 422h136M796 454h152" stroke="#52618f" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <rect x="796" y="514" width="166" height="68" rx="12" fill="#222d50"/>
    <text x="814" y="541" fill="#8d9ac8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SESSION ENERGY</text>
    <text x="814" y="566" fill="#ffcf79" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="900">98%</text>
    <path d="M892 559l12-17 8 9 16-25" fill="none" stroke="url(#orange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(88 680)">
    <circle cx="24" cy="24" r="24" fill="url(#accent)"/>
    <path d="M12 15h24M16 15v18M32 15v18" fill="none" stroke="#0d1830" stroke-width="5" stroke-linecap="round"/>
    <text x="62" y="21" fill="#f3f5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="900" letter-spacing="1">PI LIVECRAFT</text>
    <text x="62" y="43" fill="#92a0c9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">BUILD IN FLOW</text>
  </g>
  <text x="1108" y="727" text-anchor="end" fill="#7180b5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">LOCAL • PRIVATE • YOURS</text>
</svg>
